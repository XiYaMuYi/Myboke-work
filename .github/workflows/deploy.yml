name: 自动部署网站

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 安装Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 安装依赖
        run: npm install --legacy-peer-deps
      
      - name: 构建项目
        run: npx vite build
      
      - name: 上传文件到服务器
        uses: appleboy/scp-action@master
        with:
          host: 139.196.242.143
          username: root
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          source: "dist/*"
          target: "/tmp/deploy_dist"
          strip_components: 1
      
      - name: 执行部署脚本
        uses: appleboy/ssh-action@master
        with:
          host: 139.196.242.143
          username: root
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          script: |
            bash /root/deploy-website.sh
      
      - name: 部署完成
        run: echo "网站部署成功！访问 https://xiaohongquanliang.com"
